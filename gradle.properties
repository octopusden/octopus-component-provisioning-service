kotlin.version=2.4.21
kotlin.code.style=official

# Held on Boot 3.5 (Spring Framework 6.2): octopus-security-common is built for Spring 6, and its compiled
# code fails on Spring 7 (Boot 4) with a ClassCastException, as HttpHeaders is no longer a MultiValueMap.
# 2025.0.x is the Spring Cloud train for Boot 3.5; springdoc 2.8.x is the line for Boot 3.5.
spring-boot.version=3.5.16
spring-cloud.version=2025.0.3
springdoc.version=2.8.17
octopus-cloud-commons.version=2.0.20

octopus-quality.version=3.3.0
sonarqube.version=7.5.0.8588
# detekt 2 is still alpha, but 1.23.8 (the last GA) crashes on JDK 25, see the detekt JDK caveat
# in octopus-base "Octopus Quality Plugin CI Reference".
detekt.version=2.0.0-alpha.6
ktlint-gradle.version=14.2.0
kover.version=0.9.9
docker-plugin.version=10.0.0
foojay-resolver.version=1.0.0

docker.registry=docker.io
octopus.github.docker.registry=ghcr.io
